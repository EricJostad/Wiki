{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ entry }}
{% endblock %}

{% block body %}
    {% if entry %}
        <h2>{{ entry }}</h2>
        <p>{{ content }}</p>
    {% else %}
        <p>Requested entry not found.</p>
    {% endif %}
    <a href ="{% url 'encyclopedia:edit' entry %}">Edit</a>
{% endblock %}
