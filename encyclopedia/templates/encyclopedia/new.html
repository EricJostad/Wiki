{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create New Page
{% endblock %}

{% block body %}
    <h1>Create New Page</h1>
    
    <form action="{% url 'encyclopedia:new' %}" method="post">
        {% csrf_token %}    
        {{ form }}
        <input type="submit" value="Create Page">
    </form>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

{% endblock %}
