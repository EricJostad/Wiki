{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>All Pages</h1>

    <ul>
        {% for entry in entries %}
            {% comment %} <li href="{% url 'wiki:title' %}">{{ entry }}</li> {% endcomment %}
            <li>{{ entry }}</li>
        {% endfor %}
    </ul>

{% endblock %}
