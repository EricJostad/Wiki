{% extends "encyclopedia/layout.html" %}

{% block entry %}
    {{ entry }}
{% endblock %}

{% block body %}
    {% if entry %}
        {% if "#" not in content %}
            <h1>{{ entry }}</h1>
        {% endif %}
        {{ converted_content|safe }}
    {% else %}
        <p>Requested entry not found.</p>
    {% endif %}
    <a href ="{% url 'encyclopedia:edit' entry %}">Edit</a>
{% endblock %}
